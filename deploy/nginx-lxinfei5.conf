server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name lxinfei5.win www.lxinfei5.win _;
    root /var/www/index;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    autoindex off;

    include snippets/cf-vless-ws.conf;

    # Palimpsest Novel Engineering Workbench Demo
    location = /palimpsest {
        return 301 /palimpsest/;
    }
    location ^~ /palimpsest/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location = /shanwei {
        return 301 /shanwei/;
    }
    location ^~ /shanwei/ {
        alias /var/www/shanwei/;
        index index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    if ($request_method !~ ^(GET|HEAD|OPTIONS|POST)$) {
        return 405;
    }

    # Yunfu research report (prefix takes precedence over static regex)
    location = /yunfu {
        return 301 /yunfu/;
    }
    location ^~ /yunfu/ {
        alias /var/www/yunfu/;
        index index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /yangjiang {
        return 301 /yangjiang/;
    }
    location ^~ /yangjiang/ {
        alias /var/www/yangjiang/;
        index index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /dongguan {
        return 301 /dongguan/;
    }
    location ^~ /dongguan/ {
        alias /var/www/dongguan/;
        index index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    client_body_timeout 10;
    client_header_timeout 10;
    keepalive_timeout 5 5;
    send_timeout 10;
    client_max_body_size 10m;
}

