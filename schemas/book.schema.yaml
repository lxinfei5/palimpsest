# books/<id>/00_meta/book.yaml
# MVP 字段约定（描述性 schema，非 JSON Schema）

id: string                     # 与目录名一致，小写+数字+连字符
title: string
alt_titles: [string]
language: string               # zh-CN | en | ...
status: planned|ingesting|parsed|outlining|writing|paused|done
content_rating: sfw|nsfw|unrated   # 仅元数据；不再分架

genre: [string]
tags: [string]
synopsis: string

source:
  type: original|translation|web-novel|outline-only|fanwork
  rights_note: string          # 人类填写版权边界
  license: string              # 可选：CC0-1.0 等
  files: [string]              # 相对 01_sources/raw 的路径

progress:
  original_chapters: number|null
  continue_from: string|null   # e.g. c003
  rewrite_ranges: [string]

defaults:
  pov: string
  tense: string
  target_chapter_words: number
  style_notes: string

created_at: string             # ISO-8601
updated_at: string
